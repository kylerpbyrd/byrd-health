name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Install sub-packages for mypy
        run: |
          pip install packages/fertility_engine
          pip install packages/data_service
          pip install packages/ha_bridge
          pip install packages/device_adapters
          pip install packages/web_api

      - name: Mypy type check
        run: mypy packages/

      - name: Pytest
        run: pytest

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        if: steps.check_frontend.outputs.exists == 'true'
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend test
        if: steps.check_frontend.outputs.exists == 'true'
        run: npx vitest run
        working-directory: frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
