[project]
name = "byrd-health"
version = "0.1.0"
description = "Privacy-first, self-hosted health intelligence platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6.0",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["legacy/", ".opencode/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = [
    "packages/fertility_engine",
    "packages/data_service",
    "packages/web_api",
    "packages/ha_bridge",
]
pythonpath = [
    "packages/fertility_engine/src",
    "packages/data_service/src",
    "packages/web_api/src",
    "packages/ha_bridge/src",
]
norecursedirs = [
    "frontend",
    "legacy",
    "tools",
    ".git",
    "node_modules",
]
asyncio_mode = "auto"
addopts = "-v --tb=short --import-mode=importlib"
